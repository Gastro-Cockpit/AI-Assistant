# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io) when a version tag is pushed.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # MCP_PRIVATE_KEY is a secret of this environment only, which admits v* tags only: the key can publish every
    # server under de.gastro-cockpit.
    environment: mcp-registry
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: 1.8.3
      # From registry_1.8.3_checksums.txt of the same release
      MCP_PUBLISHER_SHA256: 29ed68536ad0bcf8a266d4666995f2b978740c049b8ad29a1c63fe845b2634cf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against every version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version server.json)"
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version .claude-plugin/plugin.json)"
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version plugin.json)"

      - name: Install mcp-publisher
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - run: ./mcp-publisher validate

      - run: ./mcp-publisher login dns --domain gastro-cockpit.de --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      - run: ./mcp-publisher publish
