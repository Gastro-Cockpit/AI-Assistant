# Checks the format of every file, validates the plugin and checks that every manifest carries one version.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.28.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.22.1

      # Pinned: another oxfmt version rewrites files that this check then rejects.
      - run: pnpm dlx oxfmt@0.74.0 --check .

      # Claude Code installs its native binary in a postinstall script, which pnpm runs only when allowed.
      - run: pnpm dlx --allow-build=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.309 plugin validate .

      - name: Check that every manifest carries one version
        run: |
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$(jq -r .version plugin.json)"
          test "$(jq -r .version server.json)" = "$(jq -r .version plugin.json)"
